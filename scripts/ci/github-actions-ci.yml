name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [claude-dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate homepage and JavaScript syntax
        run: node scripts/validate-homepage.mjs
      - name: Unit, SQL (PGlite) and regression tests
        run: npm test
      - name: Migration files are well-formed
        run: node -e "import('./scripts/db/migrations-lib.mjs').then(m=>console.log(m.loadMigrations('scripts/migrations').map(x=>x.id).join('\n')))"
